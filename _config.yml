title: "Rosie Artwork Studio"
description: "Artwork, notes, exhibitions, and studio writing."
url: "https://rosegabe.github.io"
baseurl: "/rosie_artwork_studio"
timezone: Europe/Berlin

collections:
  artworks:
    output: true
    permalink: /art/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: artworks
    values:
      layout: artwork

markdown: kramdown
plugins:
  - jekyll-feed

exclude:
  - README.md
  - GITHUB_PAGES_SETUP.md
