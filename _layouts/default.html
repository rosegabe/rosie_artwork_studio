<!doctype html>
<html lang="en">
  <head>
    {% assign settings = site.data.settings %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: settings.site_description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ settings.site_name | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    {% include header.html %}
    <main>
      {{ content }}
    </main>
    {% include footer.html %}
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function(user) {
          if (!user && window.location.hash.indexOf("invite_token") !== -1) {
            window.netlifyIdentity.open("signup");
          }
        });
      }
    </script>
  </body>
</html>
